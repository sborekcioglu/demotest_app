name: CI

on:
push:
pull_request:

permissions:
contents:read
pull-request: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code 
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-verison: "3.12"

      - name: Install pytest
        run: pip install pytest

        -name: Run tests
          run: pytest
